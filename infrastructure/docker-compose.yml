services:
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    container_name: lamarkerja_web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      CV_STORAGE_DIR: /data/cv
      RESUME_STORAGE_DIR: /data/resumes
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ${DATA_DIR:-/data}/cv:/data/cv
      - ${DATA_DIR:-/data}/resumes:/data/resumes
    depends_on:
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 2G
    networks:
      - internal

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.worker
    container_name: lamarkerja_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      CV_STORAGE_DIR: /data/cv
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ${DATA_DIR:-/data}/cv:/data/cv
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 2G
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    container_name: lamarkerja_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 5G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: lamarkerja_caddy
    restart: unless-stopped
    # Hanya bind ke loopback VM agar tidak mengekspos port langsung ke internet.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lamarkerja_cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      caddy:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  ollama_models:
  caddy_data:
  caddy_config:
